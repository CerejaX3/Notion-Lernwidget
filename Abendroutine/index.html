<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Abendroutine</title>
<style>
:root{color-scheme:light;--bg:#f7f3eb;--paper:#fffdf8;--ink:#594839;--muted:#827362;--sage:#8b9d83;--sage-dark:#536d50;--line:#e8e4d9;--wood:#bd9777}*{box-sizing:border-box}body{margin:0;background:transparent;color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.widget{background:var(--bg);border:1px solid #e4dfd4;border-radius:22px;padding:clamp(16px,3.5vw,28px);max-width:770px;margin:0 auto;overflow:hidden;position:relative}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.18em;color:var(--sage-dark);font-weight:750}.head{display:flex;align-items:flex-start;gap:16px;justify-content:space-between}.head h1{font-size:clamp(24px,4.5vw,32px);line-height:1.15;margin:5px 0;font-weight:650;letter-spacing:-.035em}.sub{color:var(--muted);font-size:13px;margin:0}.sun{font-family:Georgia,serif;background:#e8e5d5;border:1px solid #d6d5c7;width:45px;height:45px;flex-shrink:0;display:grid;place-items:center;border-radius:50%;color:#9a7e57;font-size:25px}.progress{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin:23px 0 9px}.track{height:7px;border-radius:40px;background:#e2e4d9;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#a7b59a,#748b70);width:0;transition:width .35s}.tasks{display:grid;gap:9px;margin-top:19px}.task{background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:13px 13px 13px 15px;box-shadow:0 1px 2px #44351b08;animation:enter .3s ease}.task-row{display:flex;align-items:center;gap:11px}.done{width:32px;height:32px;border-radius:50%;border:1.5px solid #b6c5af;background:#eff3eb;color:var(--sage-dark);font-size:17px;cursor:pointer;flex-shrink:0;transition:transform .15s,background .15s}.done:hover{background:#dce8d7;transform:scale(1.06)}.task-label{color:var(--ink);font-size:14px;font-weight:530;flex:1;line-height:1.45;min-width:0}.task-detail{margin:3px 66px 0 43px;color:var(--muted);font-size:12px;line-height:1.5}.skip{border:1px solid #e7e0d5;background:#f9f5ec;color:#786b5b;padding:8px 11px;border-radius:9px;font:inherit;font-size:12px;cursor:pointer;white-space:nowrap}.skip:hover{background:#ede5d8}.toggle{border:0;background:transparent;color:#708468;cursor:pointer;font-size:18px;padding:3px 5px;transition:transform .2s}.toggle[aria-expanded=true]{transform:rotate(180deg)}.subtasks{margin:14px 0 2px 43px;border-top:1px solid var(--line);padding-top:11px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.exercise{background:#f4f5ee;border-radius:8px;padding:9px 10px;font-size:12px;display:flex;justify-content:space-between;gap:6px}.duration{color:#74866c;white-space:nowrap}.finish{display:none;text-align:center;background:var(--paper);border:1px solid var(--line);padding:40px 16px;border-radius:16px;margin-top:20px}.finish.show{display:block;animation:enter .4s ease}.finish .heart{font-size:35px;color:#799172}.finish h2{color:var(--ink);font-size:22px;margin:10px 0 8px;font-weight:650}.finish p{color:var(--ink);font-size:14px;color:var(--muted);margin:0}.bottom{margin-top:18px;display:flex;align-items:center;justify-content:space-between;gap:8px;color:#858777;font-size:11px}.bottom button{border:0;background:transparent;color:var(--sage-dark);font:inherit;font-size:11px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}.bottom button:hover{color:#344b30}canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:10}@keyframes enter{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}@media(max-width:440px){.subtasks{grid-template-columns:1fr}.widget{border-radius:14px}.task{padding:11px}.task-label{font-size:13px}.skip{padding:7px 8px}.task-detail{margin-right:0}}
</style>
</head>
<body><section class="widget" id="widget"><canvas id="confetti" aria-hidden="true"></canvas><header class="head"><div><h1>Guten Abend</h1></div><span class="sun" aria-hidden="true">☾</span></header><div class="progress"><span>Deine Abendroutine</span><span id="progressText">0 von 7</span></div><div class="track" role="progressbar" aria-label="Fortschritt Abendroutine" aria-valuemin="0" aria-valuemax="7" aria-valuenow="0" id="bar"><div class="fill" id="fill"></div></div><div class="tasks" id="tasks"></div><div class="finish" id="finish" role="status"><div class="heart">♥</div><h2>Für heute ist alles erledigt.</h2></div><footer class="bottom"><span>Täglich zurückgesetzt um 23:59 Uhr</span><button id="undo" hidden>Letzten Schritt rückgängig</button></footer></section>
<script>
(()=>{'use strict';const ITEMS=[{id:'prepare',text:'Den nächsten Tag vorbereiten',details:'Kleidung für morgen herauslegen und wichtige Dinge bereitlegen.'},{id:'care',text:'Körperpflege',details:'Zähneputzen, Abschminken, Gua-Sha.'},{id:'phone',text:'Handy weglegen'},{id:'tea',text:'Gute-Nacht-Tee'},{id:'journal',text:'Journaln',details:'Was war heute schön? Wie ging es meinem Körper? Was darf ich heute loslassen?'},{id:'stretch',text:'Sanftes Dehnen, bewusstes Atmen'},{id:'pmr',text:'Progressive Muskelentspannung'}];const KEY='abendroutine_notionsage_v1';const $=id=>document.getElementById(id);let state={date:'',actions:{},expanded:false},history=[];const today=()=>{const now=new Date();const d=new Date(now);if(now.getHours()===23&&now.getMinutes()>=59)d.setDate(d.getDate()+1);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};function load(){try{let raw=JSON.parse(localStorage.getItem(KEY));if(raw&&raw.date===today()&&raw.actions&&typeof raw.actions==='object')state={date:raw.date,actions:raw.actions,expanded:!!raw.expanded};else state={date:today(),actions:{},expanded:false}}catch{state={date:today(),actions:{},expanded:false}}save()}function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}}function checkDate(){if(state.date!==today()){state={date:today(),actions:{},expanded:false};history=[];save();render()}}function setTask(id,kind){checkDate();history.push({id,previous:state.actions[id]});state.actions[id]=kind;save();render();if(kind==='done')confetti()}function undo(){let h=history.pop();if(!h)return;if(h.previous===undefined)delete state.actions[h.id];else state.actions[h.id]=h.previous;save();render()}function render(){const container=$('tasks');container.replaceChildren();const remaining=ITEMS.filter(item=>!state.actions[item.id]);const handled=ITEMS.length-remaining.length;$('progressText').textContent=`${handled} von ${ITEMS.length}`;$('fill').style.width=`${handled/ITEMS.length*100}%`;$('bar').setAttribute('aria-valuenow',handled);$('finish').classList.toggle('show',remaining.length===0);$('undo').hidden=history.length===0;for(const item of remaining){let section=document.createElement('section');section.className='task';let row=document.createElement('div');row.className='task-row';let done=document.createElement('button');done.className='done';done.type='button';done.textContent='✓';done.setAttribute('aria-label',`${item.text} erledigt`);done.addEventListener('click',()=>setTask(item.id,'done'));let label=document.createElement('span');label.className='task-label';label.textContent=item.text;row.append(done,label);if(item.exercises){let toggle=document.createElement('button');toggle.className='toggle';toggle.type='button';toggle.textContent='⌄';toggle.setAttribute('aria-label','Übungen ein- oder ausklappen');toggle.setAttribute('aria-expanded',String(state.expanded));toggle.addEventListener('click',()=>{state.expanded=!state.expanded;save();render()});row.append(toggle)}let skip=document.createElement('button');skip.className='skip';skip.type='button';skip.textContent='Skippen';skip.setAttribute('aria-label',`${item.text} überspringen`);skip.addEventListener('click',()=>setTask(item.id,'skipped'));row.append(skip);section.append(row);if(item.details){const detail=document.createElement('div');detail.className='task-detail';detail.textContent=item.details;section.append(detail)}if(item.exercises&&state.expanded){let div=document.createElement('div');div.className='subtasks';for(const exercise of item.exercises){let e=document.createElement('div');e.className='exercise';let name=document.createElement('span');name.textContent=exercise;let dur=document.createElement('span');dur.className='duration';dur.textContent='1 Min.';e.append(name,dur);div.append(e)}section.append(div)}container.append(section)}}$('undo').addEventListener('click',undo);
const canvas=$('confetti'),ctx=canvas.getContext('2d');let pieces=[],frame=null;const colors=['#7e9879','#bac8aa','#c4a17d','#e6d9b7','#9aaf90','#d3bda4'];function sizeCanvas(){const r=$('widget').getBoundingClientRect();const dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}function confetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;sizeCanvas();const w=canvas.width/(Math.min(devicePixelRatio||1,2));const h=canvas.height/(Math.min(devicePixelRatio||1,2));for(let i=0;i<85;i++)pieces.push({x:w*(.18+Math.random()*.64),y:h*.24,vx:(Math.random()-.5)*7,vy:-2-Math.random()*5,rot:Math.random()*6,s:3+Math.random()*5,life:0,color:colors[Math.floor(Math.random()*colors.length)]});if(!frame)animate()}function animate(){const w=canvas.width/Math.min(devicePixelRatio||1,2),h=canvas.height/Math.min(devicePixelRatio||1,2);ctx.clearRect(0,0,w,h);pieces=pieces.filter(p=>p.life<100&&p.y<h+10);for(const p of pieces){p.vy+=.13;p.x+=p.vx;p.y+=p.vy;p.rot+=.09;p.life++;ctx.save();ctx.globalAlpha=Math.min(1,(100-p.life)/22);ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.color;ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.65);ctx.restore()}frame=pieces.length?requestAnimationFrame(animate):null;if(!frame)ctx.clearRect(0,0,w,h)}load();render();setInterval(checkDate,1000);document.addEventListener('visibilitychange',checkDate);window.addEventListener('focus',checkDate)})();
</script></body></html>
